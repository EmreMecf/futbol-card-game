# Kod kalitesi kurallari.
# Kaynak: package:flutter_lints + projeye ozel eklemeler.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Uretilen dosyalardaki uyarilari gormezden gel
    invalid_annotation_target: ignore
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "build/**"

linter:
  rules:
    # ---- Zorunlu tuttugumuz kurallar ----
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    avoid_print: true              # AppLogger kullan
    always_declare_return_types: true
    unawaited_futures: true
    require_trailing_commas: true

    # ---- Kapattigimiz kurallar ----
    # Turkce dokumantasyon yazdigimiz icin bu kural gereksiz gurultu yapiyor
    lines_longer_than_80_chars: false
