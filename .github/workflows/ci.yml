# =====================================================================
# SUREKLI ENTEGRASYON (bagimsiz inceleme, madde 6)
# =====================================================================
# Her push ve pull request'te calisir. Bir adim calistirilamazsa is
# KIRMIZI olur; "atlandi" basari sayilmaz.
#
# Isler:
#   uygulama   : Flutter analyze + Flutter testleri
#   paketler   : ortak modeller, taktik prototipi, sunucu analyze + test
#   veritabani : izole PostgreSQL'de scripts/db-testleri.sh
#                (sifirdan kurulum, kural testleri, tekrar calistirma,
#                 mac surerken yukseltme)
#   uctan_uca  : izole PostgreSQL + gercek sunucu, tam mac ve
#                gercek zamanli bildirim zinciri
#   android    : release APK derleme kontrolu
#
# NOT: Bu CI veritabani ve JWT icin GECICI degerler kullanir; hicbiri
# uretim sirri degildir.
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  # -------------------------------------------------------------------
  uygulama:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # .env pakete gomulen bir varlik; depoda yok (gizli olabilir).
      # CI ornek dosyayi kullanir.
      - name: .env olustur
        run: cp .env.example .env

      # Freezed/json kodu depoda tutulmuyor (.gitignore)
      - name: Ortak modellerin kodunu uret
        working-directory: packages/shared_models
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs

      - run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      # test/api_integration_test.dart canli sunucu ister; burada sunucu
      # olmadigi icin o testler "atlandi" olarak raporlanir. Canli sunucu
      # zinciri 'uctan_uca' isinde AYRICA test ediliyor.
      - name: Flutter testleri
        run: flutter test
      - name: Web derlenebilirlik
        run: flutter build web --release --dart-define=API_BASE_URL=https://ci.example.invalid

  # -------------------------------------------------------------------
  paketler:
    name: Dart paketleri + sunucu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Ortak modeller
        working-directory: packages/shared_models
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
          dart analyze
          dart test

      - name: Taktik prototipi (kurallar + denge)
        working-directory: packages/tactics_prototype
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Icerik uretim hatti (dogrulayici, Denge Motoru; ag yok, ucretsiz)
        working-directory: packages/content_pipeline
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Sunucu
        working-directory: server
        run: |
          dart pub get
          dart analyze
          dart test

      # Faz 2 tasarim sayilari (seviye B2, lig tavani, etkin guce gore eslesme)
      - name: Seviye bonusu + eslestirme tasarim testleri
        run: python3 -I tool/ekonomi/test_seviye_eslestirme.py -v

  # -------------------------------------------------------------------
  veritabani:
    name: Veritabani (izole PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: futbol
          POSTGRES_PASSWORD: ci_gecici_sifre
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U futbol -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: futbol
      PGPASSWORD: ci_gecici_sifre
    steps:
      - uses: actions/checkout@v4
      - name: psql istemcisi
        run: |
          # Ubuntu runner mirror/DNS kesintilerine karsi kontrollu retry.
          # Paket kurulamadiysa test calismadan is basarisiz kalir.
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -qq &&
               sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Acquire::Retries=3 postgresql-client; then
              psql --version
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "PostgreSQL istemcisi 3 denemede de kurulamadi"
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Veritabani testleri
        run: bash scripts/db-testleri.sh
      # 037+ migration'lar gecmis kullanici verisini (transfer, sahiplik,
      # maclar, sandiklar, defter) DEGISTIRMEMELI
      - name: Gecmis veri degismedi
        run: |
          SINIR=037 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=039 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=040 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=041 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=042 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=043 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=044 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=046 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=047 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=048 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=049 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=050 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=051 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=052 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=053 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=054 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=055 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=056 bash scripts/gecmis-veri-kontrolu.sh
          SINIR=057 bash scripts/gecmis-veri-kontrolu.sh
      # 039: ayni maci ayni anda ilerleten oturumlar turu iki kez cozmemeli
      - name: Es zamanli duello yaris testi
        run: bash scripts/esz-zamanli-yaris-testi.sh

  # -------------------------------------------------------------------
  uctan_uca:
    name: Uctan uca (gercek sunucu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: futbol
          POSTGRES_PASSWORD: ci_gecici_sifre
          POSTGRES_DB: futbol_card
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U futbol -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: futbol
      PGPASSWORD: ci_gecici_sifre
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: futbol_card
      DB_USER: futbol
      DB_PASSWORD: ci_gecici_sifre
      PORT: "8080"
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: psql istemcisi
        run: |
          # Ubuntu runner mirror/DNS kesintilerine karsi kontrollu retry.
          # Paket kurulamadiysa test calismadan is basarisiz kalir.
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -qq &&
               sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Acquire::Retries=3 postgresql-client; then
              psql --version
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "PostgreSQL istemcisi 3 denemede de kurulamadi"
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Migration'lari uygula (her biri tek islemde)
        run: |
          for m in $(git ls-files 'database/migrations/*.sql' | sort); do
            psql -d futbol_card -v ON_ERROR_STOP=1 -q -1 -f "$m"
          done

      - name: Ortak modellerin kodunu uret
        working-directory: packages/shared_models
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Sunucuyu baslat
        working-directory: server
        run: |
          dart pub get
          nohup dart run bin/server.dart > ../sunucu.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Sunucu hazir"; exit 0
            fi
            sleep 2
          done
          echo "Sunucu acilmadi"; cat ../sunucu.log; exit 1

      - name: Tam mac (taktik, gizlilik, lig degisimi)
        working-directory: server
        run: dart run tool/full_match_test.dart

      - name: Gercek zamanli bildirim zinciri
        working-directory: server
        run: dart run tool/realtime_test.dart

      - name: Sunucu gunlugunde jeton olmamali
        if: always()
        run: |
          if grep -q 'eyJ' sunucu.log; then
            echo "HATA: sunucu gunlugunde JWT bulundu"; exit 1
          fi
          echo "Gunlukte jeton yok"

  # -------------------------------------------------------------------
  android:
    name: Android release derleme
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # flutter_secure_storage API 37 ile derlenmeyi istiyor
      # (android/app/build.gradle.kts: compileSdk >= 37)
      - name: Android SDK Platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      # NDK'yi derlemeden ONCE ve yeniden denemeli kur. Gradle'in otomatik
      # indirmesi 42832383837'de bozuk arsiv yuzunden kaldi ("Archive is not
      # a ZIP archive", NDK 28.2.13676358); kod hatasi degildi. Surum
      # Flutter'in kendi ayarindan okunur (Flutter guncellenince elle
      # degistirmek gerekmez).
      - name: Android NDK (yeniden denemeli)
        run: |
          FR="${FLUTTER_ROOT:-$(dirname "$(dirname "$(which flutter)")")}"
          NDK=$(grep -oE 'val ndkVersion: String = "[0-9.]+"' "$FR/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" | grep -oE '[0-9]+(\.[0-9]+)+')
          test -n "$NDK" || { echo "NDK surumu okunamadi"; exit 1; }
          echo "NDK $NDK"
          for i in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null; then
              test -f "$ANDROID_HOME/ndk/$NDK/source.properties" && exit 0
            fi
            echo "NDK kurulamadi (deneme $i), yeniden deneniyor"
            rm -rf "$ANDROID_HOME/ndk/$NDK"
            sleep 15
          done
          exit 1

      - name: .env olustur
        run: cp .env.example .env

      - name: Ortak modellerin kodunu uret
        working-directory: packages/shared_models
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs

      # key.properties CI'da yok: APK debug anahtariyla imzalanir.
      # TEST TELEFONUNA KURULABILIR, Play Store'a yuklenemez.
      - name: Staging release APK (gercek HTTPS API)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=https://futbol-card-staging-api-lzq3.onrender.com
          --dart-define=GOOGLE_WEB_CLIENT_ID=438252320232-herv722ro3g44n91rsjs65j76fhhankb.apps.googleusercontent.com
          --dart-define=GOOGLE_IOS_CLIENT_ID=438252320232-f8a1sodjhq4lddij8kgnnslpu4a24hvb.apps.googleusercontent.com

      # PR'lar: yalniz derlenebilirlik
      - name: Release APK derlenebilirlik (PR ve diger dallar)
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: flutter build apk --release --dart-define=API_BASE_URL=https://ci.example.invalid

      - name: Staging APK dosyasini indirilebilir artifact olarak sakla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: futbol-card-arena-staging-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: APK icinde INTERNET izni olmali
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | tee badging.txt | grep -E "^package|application-label"
          grep -q "uses-permission: name='android.permission.INTERNET'" badging.txt

  # -------------------------------------------------------------------
  staging_docker:
    name: Staging Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Docker staging image
        run: docker build --pull -f Dockerfile.staging -t futbol-card-staging:ci .
