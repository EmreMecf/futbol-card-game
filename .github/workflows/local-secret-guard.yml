name: Local secret tracking guard

on:
  push:
    branches: [main, feature/ui-v21-rebuild, fix/v21-security-and-release-readiness]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked local credentials and signing keys
        run: bash scripts/check-local-secrets.sh
