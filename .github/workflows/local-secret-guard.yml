name: Yerel gizli dosya denetimi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Git takibindeki yerel sifre ve imza dosyalarini reddet
        run: bash scripts/check-local-secrets.sh
