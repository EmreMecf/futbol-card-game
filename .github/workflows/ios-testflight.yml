name: iOS Staging - TestFlight

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'packages/shared_models/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:
    inputs:
      publish_testflight:
        description: 'I have configured Apple credentials and explicitly approve TestFlight upload'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.1"
  STAGING_API_URL: "https://futbol-card-staging-api-lzq3.onrender.com"
  EXPECTED_IOS_BUNDLE_ID: "com.futbolcard.futbolCard"

jobs:
  # This does not sign, upload, or need Apple credentials. Run on PR.
  ios_compile:
    name: iOS unsigned compile (macOS)
    if: github.event_name == 'pull_request' || !inputs.publish_testflight
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Confirm toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Create nonsecret Flutter configuration
        run: cp .env.example .env
      - name: Generate shared models
        working-directory: packages/shared_models
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Compile iOS without code signing
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$STAGING_API_URL"
      - name: Confirm unsigned app bundle
        run: test -d build/ios/iphoneos/Runner.app

  testflight:
    name: Signed IPA and manual TestFlight upload
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testflight && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-testflight
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_PROFILE_NAME: ${{ vars.IOS_PROFILE_NAME }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_IOS_REVERSED_CLIENT_ID: ${{ vars.GOOGLE_IOS_REVERSED_CLIENT_ID }}
      # Apple ile giris: App ID'de "Sign In with Apple" acilip profil ondan
      # SONRA uretildiyse 'true' yap. Bos ya da 'false' ise dugme gizli kalir.
      APPLE_SIGN_IN_IOS: ${{ vars.APPLE_SIGN_IN_IOS }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
      IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed when credentials are absent
        shell: bash
        run: |
          for v in IOS_TEAM_ID IOS_PROFILE_NAME GOOGLE_WEB_CLIENT_ID \
                   GOOGLE_IOS_CLIENT_ID GOOGLE_IOS_REVERSED_CLIENT_ID \
                   APPSTORE_ISSUER_ID APPSTORE_API_KEY_ID \
                   IOS_DISTRIBUTION_CERT_P12_BASE64 \
                   IOS_DISTRIBUTION_CERT_PASSWORD \
                   IOS_PROVISIONING_PROFILE_BASE64 APPSTORE_API_PRIVATE_KEY; do
            if [[ -z "${!v:-}" ]]; then
              echo "::error::Missing GitHub Environment secret/variable: $v"
              exit 1
            fi
          done
          if [[ ! "$IOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::IOS_TEAM_ID format invalid"; exit 1
          fi
      - name: Confirm Xcode 26 toolchain
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -version | grep -Eq '^Xcode 26(\.|$)'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Create nonsecret Flutter configuration
        run: cp .env.example .env
      - name: Generate shared models
        working-directory: packages/shared_models
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Install temporary distribution certificate and profile
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios_appstore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ios_appstore_profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          printf '%s' "$IOS_DISTRIBUTION_CERT_P12_BASE64" | base64 -D > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          PROFILE_NAME_ACTUAL="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          if [[ "$PROFILE_BUNDLE" != "$IOS_TEAM_ID.$EXPECTED_IOS_BUNDLE_ID" ||
                "$PROFILE_TEAM" != "$IOS_TEAM_ID" ||
                "$PROFILE_NAME_ACTUAL" != "$IOS_PROFILE_NAME" ]]; then
            echo "::error::Provisioning profile doesn't match Team ID, Bundle ID, or profile name"
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f "$CERT_PATH" "$PROFILE_PATH"
          echo "Installed an App Store distribution profile for expected bundle ID."

      - name: Configure runner-only Xcode signing, Google URL scheme and export options
        shell: bash
        run: |
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          bundle = os.environ["EXPECTED_IOS_BUNDLE_ID"]
          team = os.environ["IOS_TEAM_ID"]
          profile = os.environ["IOS_PROFILE_NAME"]
          xcode = Path("ios/Runner.xcodeproj/project.pbxproj")
          src = xcode.read_text()
          old = "PRODUCT_BUNDLE_IDENTIFIER = " + bundle + ";"
          if src.count(old) != 3:
              raise SystemExit("Expected exactly 3 Runner bundle declarations")
          # Apple ile giris acikken uygulamaya yetki dosyasi baglanir
          # (profilde "Sign In with Apple" yoksa imza burada hata verir)
          yetki = ("\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;\n"
                   if os.environ.get("APPLE_SIGN_IN_IOS") == "true" else "")
          src = src.replace(old, (
              "DEVELOPMENT_TEAM = " + team + ";\n"
              + yetki +
              "\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
              "\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"" + profile + "\";\n"
              "\t\t\t\t" + old))
          xcode.write_text(src)
          info_file = Path("ios/Runner/Info.plist")
          with info_file.open("rb") as f:
              info = plistlib.load(f)
          scheme = os.environ["GOOGLE_IOS_REVERSED_CLIENT_ID"]
          types = info.setdefault("CFBundleURLTypes", [])
          if not any(scheme in t.get("CFBundleURLSchemes", []) for t in types):
              types.append({"CFBundleURLSchemes": [scheme]})
          with info_file.open("wb") as f:
              plistlib.dump(info, f)
          export = {
            "method": "app-store-connect",
            "signingStyle": "manual",
            "teamID": team,
            "provisioningProfiles": {bundle: profile},
            "manageAppVersionAndBuildNumber": False,
            "uploadSymbols": True,
          }
          with open(os.environ["RUNNER_TEMP"] + "/ExportOptions.plist", "wb") as f:
              plistlib.dump(export, f)
          PY

      - name: Build signed staging IPA for TestFlight
        shell: bash
        run: |
          flutter build ipa --release \
            --build-name=1.0.0 --build-number="${{ github.run_number }}" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define=API_BASE_URL="$STAGING_API_URL" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --dart-define=APPLE_SIGN_IN_IOS="${APPLE_SIGN_IN_IOS:-false}"
          shopt -s nullglob
          ipa_files=(build/ios/ipa/*.ipa)
          if (( ${#ipa_files[@]} != 1 )); then
            echo "::error::Expected one signed IPA"; exit 1
          fi
          cp "${ipa_files[0]}" "$RUNNER_TEMP/futbol-card-staging.ipa"
          xcrun codesign --verify --deep --strict build/ios/archive/*.xcarchive/Products/Applications/Runner.app

      - name: Upload signed IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/futbol-card-staging.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Remove temporary signing materials
        if: always()
        shell: bash
        run: |
          security default-keychain -s "$HOME/Library/Keychains/login.keychain-db" || true
          security delete-keychain "$RUNNER_TEMP/ios-build.keychain-db" || true
          rm -f "$RUNNER_TEMP/ios_distribution.p12" \
            "$RUNNER_TEMP/ios_appstore.mobileprovision" \
            "$RUNNER_TEMP/ios_appstore_profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist" \
            "$RUNNER_TEMP/futbol-card-staging.ipa"
