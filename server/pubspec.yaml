name: futbol_card_server
description: Futbol Kart oyununun backend sunucusu (Dart + Shelf + PostgreSQL).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.1
  postgres: ^3.5.6
  dart_jsonwebtoken: ^3.2.0
  bcrypt: ^1.1.3
  crypto: ^3.0.6
  uuid: ^4.5.1

  # Flutter uygulamasi ile ORTAK veri modelleri
  shared_models:
    path: ../packages/shared_models

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.15
