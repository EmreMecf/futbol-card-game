# Kod uretimi ayarlari.
#
# EN ONEMLI AYAR: field_rename: snake
# Veritabani ve API kolon adlari snake_case (user_card_id),
# Dart alan adlari camelCase (userCardId). Bu ayar donusumu
# otomatik yapar; elle @JsonKey yazmak gerekmez.
targets:
  $default:
    builders:
      json_serializable:
        options:
          field_rename: snake
          explicit_to_json: true
          create_factory: true
          create_to_json: true
